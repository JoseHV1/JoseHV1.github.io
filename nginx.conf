server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 512;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Vite fingerprints everything under /assets: safe to cache forever.
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unhashed files (index.html, locales, images, favicon): revalidate on every visit.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
